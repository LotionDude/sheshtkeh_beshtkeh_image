{{- if ne (int .Values.replicaCount) 1 }}{{ fail "Sheshtkeh Beshtkeh requires exactly one replica" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sheshtkeh-beshtkeh.name" . }}
  labels:
    {{- include "sheshtkeh-beshtkeh.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Never overlap processes owning in-memory games and the analytics directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sheshtkeh-beshtkeh.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
        {{- include "sheshtkeh-beshtkeh.selector" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
        checksum/config: {{ .Files.Get "config/application.yaml" | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: application
          image: {{ printf "%s%s:%s" (ternary (printf "%s/" .Values.image.registry) "" (ne .Values.image.registry "")) .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args: ["--spring.config.additional-location=file:/config/application.yaml"]
          env:
            - name: SERVER_PORT
              value: {{ .Values.applicationPort | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: production
            {{- if .Values.admin.existingSecret }}
            - name: SHESHTKEH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret | quote }}
                  key: {{ .Values.admin.passwordKey | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.applicationPort }}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ include "sheshtkeh-beshtkeh.name" . }}-config
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "sheshtkeh-beshtkeh.name" .) | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
