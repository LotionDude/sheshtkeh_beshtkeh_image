# Deployment settings only. Edit config/application.yaml for Spring settings.
replicaCount: 1
image:
  registry: ""
  repository: sheshtkeh-beshtkeh
  tag: "0.1.0-beta"
  pullPolicy: IfNotPresent
imagePullSecrets: []
applicationPort: 8080
service:
  port: 8080
route:
  enabled: false
  host: ""
  annotations:
    haproxy.router.openshift.io/timeout: 2h
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
persistence:
  enabled: true
  size: 2Gi
  storageClass: null
  accessModes: [ReadWriteOnce]
  existingClaim: ""
admin:
  existingSecret: ""
  passwordKey: password
# Initial budgets, not benchmarks. JVM uses container-aware heap sizing.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "2"
    memory: 1Gi
podAnnotations: {}
podLabels: {}
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
